---
- name: Restart node_exporter (Linux).
  ansible.builtin.service:
    name: "{{ prometheus_node_exporter_service_name }}"
    state: restarted
    enabled: true
  become: true
  when: ansible_facts["system"] == "Linux"

- name: Restart node_exporter (macOS).
  ansible.builtin.command: /opt/homebrew/bin/brew services restart {{ prometheus_node_exporter_service_name }}
  when: ansible_facts["system"] == "Darwin"
  register: restart_node_exporter_command
  changed_when: restart_node_exporter_command.rc == 0
  failed_when: restart_node_exporter_command.rc > 0
