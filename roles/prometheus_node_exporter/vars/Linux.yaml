---
prometheus_node_exporter_arguments_system:
  - '--collector.arp'
  - '--collector.btrfs'
  - '--collector.conntrack'
  - '--collector.cpufreq'
  - '--collector.dmi'
  - '--collector.entropy'
  - '--collector.ethtool'
  - '--collector.ethtool.device-include="^(br|en|tailscale|vmbr|wg|wl)"'
  - '--collector.filefd'
  - '--collector.hwmon'
  - '--collector.interrupts'
  - '--collector.logind'
  - '--collector.mdadm'
  - '--collector.netclass'
  - '--collector.netdev.device-include="^(br|en|tailscale|vmbr|wg|wl)"'
  - '--collector.netstat'
  - '--collector.network_route'
  - '--collector.nvme'
  - '--collector.pressure'
  - '--collector.processes'
  - '--collector.stat'
  - '--collector.systemd'
  - '--collector.tcpstat'
  - '--collector.thermal_zone'
  - '--collector.timex'
  - '--collector.wifi'
prometheus_node_exporter_environment_path: /etc/default/prometheus-node-exporter
prometheus_node_exporter_service_name: prometheus-node-exporter.service
