---
prometheus_node_exporter_arguments_system:
  - '--collector.boottime'
  - '--collector.filesystem.mount-points-exclude="^(/System/Volumes|/Volumes/com.apple.TimeMachine.localsnapshots)/"'
  - '--collector.netdev.device-include="^(br|en|tailscale|vmbr|wg|wl)"'
prometheus_node_exporter_environment_path: /opt/homebrew/etc/node_exporter.args
prometheus_node_exporter_package_name: node_exporter
prometheus_node_exporter_service_name: node_exporter
