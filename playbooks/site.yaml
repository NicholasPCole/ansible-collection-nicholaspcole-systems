---
- name: Apply most roles.
  hosts: all
  roles:
    - aptitude
    - prometheus_node_exporter
    - screen
    - tailscale
    - vim
    - zsh

- name: Apply roles to desktops.
  hosts: desktops
  roles:
    - git
    - sublime_text
    - terraform
    - zed

- name: Apply roles to leader.
  hosts: leader
  roles:
    - prometheus
